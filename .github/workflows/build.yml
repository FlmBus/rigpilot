# RigPilot — multi-platform Tauri build pipeline (GitHub Actions)
#
# Targets: Linux x86_64 (deb/rpm/AppImage + Arch PKGBUILD), Windows x86_64
#          (NSIS/MSI), macOS x86_64 + aarch64 (dmg). Tauri cannot cross-compile
#          between OSes, so each OS builds natively; both macOS architectures
#          build on the Apple-Silicon runner (x86_64 via rustup target).
#
# Releases are fully managed by semantic-release (.releaserc.json):
#   push to main  → test → compute next version from conventional commits →
#   build bundles stamped with that version → semantic-release tags, bumps the
#   version files, and publishes a GitHub release with all bundles attached.
# Pushes whose commits don't warrant a release (chore/docs/ci/…) still build,
# bundles are kept as workflow artifacts (14 days), but nothing is released.
# The `dev` branch is a prerelease channel (vX.Y.Z-dev.N).

name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; never cancel main/dev runs mid-release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
    libxdo-dev build-essential pkg-config libssl-dev curl wget file
    libasound2-dev
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good
    gstreamer1.0-plugins-bad gstreamer1.0-libav
  SEMREL_PACKAGES: >-
    --package semantic-release
    --package @semantic-release/exec
    --package @semantic-release/git
    --package conventional-changelog-conventionalcommits

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: cargo test --locked
        working-directory: app/src-tauri

  version:
    name: Compute next version
    needs: test
    runs-on: ubuntu-latest
    # semantic-release verifies the token has push rights even in dry-run mode
    permissions:
      contents: write
    outputs:
      next: ${{ steps.semrel.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: semantic-release dry run
        id: semrel
        if: github.event_name != 'pull_request'
        # explicit bash => -o pipefail, so a crashed dry run fails the job
        # instead of silently producing an empty version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: 1
        run: |
          npx --yes $SEMREL_PACKAGES semantic-release --dry-run | tee semrel.log
          next=$(sed -n 's/.*[Tt]he next release version is \([0-9A-Za-z.-]*\).*/\1/p' semrel.log | tail -n1)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "next version: ${next:-<no release>}"

  build:
    name: Build ${{ matrix.name }}
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: rigpilot-linux-x86_64
            bundle-glob: |
              app/src-tauri/target/release/bundle/deb/*.deb
              app/src-tauri/target/release/bundle/rpm/*.rpm
              app/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows x86_64
            os: windows-latest
            artifact: rigpilot-windows-x86_64
            bundle-glob: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/bundle/msi/*.msi
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: rigpilot-macos-arm64
            bundle-glob: |
              app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: rigpilot-macos-x86_64
            bundle-glob: |
              app/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.artifact }}
      - run: npm ci
      - name: Stamp release version into the bundles
        if: needs.version.outputs.next != ''
        shell: bash
        working-directory: .
        run: node scripts/set-version.mjs "${{ needs.version.outputs.next }}"
      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle-glob }}
          retention-days: 14

  release:
    name: Release
    needs: [version, build]
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Render Arch PKGBUILD from the released deb
        env:
          VERSION: ${{ needs.version.outputs.next }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease version — skipping PKGBUILD (pkgver must not contain '-')"
            exit 0
          fi
          deb=$(find artifacts -name '*_amd64.deb' | head -n1)
          sha256=$(sha256sum "$deb" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$VERSION/" \
              -e "s/@SHA256@/$sha256/" \
              -e "s|@REPO@|$GITHUB_REPOSITORY|" \
              packaging/aur/PKGBUILD > artifacts/PKGBUILD
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Flemming
          GIT_AUTHOR_EMAIL: flemming.busman@gmail.com
          GIT_COMMITTER_NAME: Flemming
          GIT_COMMITTER_EMAIL: flemming.busman@gmail.com
        run: npx --yes $SEMREL_PACKAGES semantic-release
