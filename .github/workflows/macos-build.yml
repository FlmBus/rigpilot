# RigPilot — macOS CI build (build farm only, releases live in GitLab)
#
# This repository is a push mirror of the GitLab project. GitHub Actions is
# used solely because GitLab SaaS macOS runners require a paid tier; all
# releases are still created in GitLab.
#
# On every push/PR: build both macOS targets and keep the bundles as
# workflow artifacts (14 days).
# On tag pushes (v*): additionally upload the .dmg files to the GitLab
# project's generic package registry and create the GitLab release (or, if
# the GitLab pipeline created it first, just add the macOS asset links —
# both sides are idempotent, see the `release` job in .gitlab-ci.yml).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GITLAB_URL         e.g. https://gitlab.example.com (no trailing slash)
#   GITLAB_PROJECT_ID  numeric project id (GitLab project → Settings → General)
#   GITLAB_TOKEN       project access token, role Developer+, scope: api
#                      (needed for both package upload and release creation)

name: macOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest # Apple Silicon; x86_64 is cross-compiled on it
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rigpilot-macos-${{ matrix.arch }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 14

      - name: Push .dmg to GitLab package registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            file="RigPilot_${VERSION}_${{ matrix.arch }}.dmg"
            echo "Uploading $dmg as $file"
            curl --fail-with-body \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --upload-file "$dmg" \
              "${GITLAB_URL}/api/v4/projects/${GITLAB_PROJECT_ID}/packages/generic/rigpilot-macos/${VERSION}/${file}"
          done

  gitlab-release:
    name: Create/update GitLab release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitLab release or add macOS asset links
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="${GITLAB_URL}/api/v4/projects/${GITLAB_PROJECT_ID}"
          pkg="${api}/packages/generic/rigpilot-macos/${VERSION}"

          links='[
            {"name":"macOS (Apple Silicon) .dmg","url":"'"${pkg}/RigPilot_${VERSION}_arm64.dmg"'"},
            {"name":"macOS (Intel) .dmg","url":"'"${pkg}/RigPilot_${VERSION}_x86_64.dmg"'"}
          ]'
          payload='{"tag_name":"'"${VERSION}"'","name":"RigPilot '"${VERSION}"'","description":"RigPilot '"${VERSION}"' — Linux, Windows and macOS builds.","assets":{"links":'"${links}"'}}'

          code=$(curl -s -o resp.json -w '%{http_code}' -X POST \
            -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -H 'Content-Type: application/json' \
            -d "${payload}" "${api}/releases")

          if [ "$code" = "201" ]; then
            echo "Release ${VERSION} created with macOS links."
          elif [ "$code" = "409" ]; then
            echo "Release exists (created by the GitLab pipeline) — adding macOS links."
            echo "${links}" | jq -c '.[]' | while read -r link; do
              curl --fail-with-body -X POST \
                -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -H 'Content-Type: application/json' \
                -d "${link}" "${api}/releases/${VERSION}/assets/links"
            done
          else
            echo "Release creation failed with HTTP ${code}:" && cat resp.json && exit 1
          fi
