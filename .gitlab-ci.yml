# RigPilot — multi-platform Tauri build pipeline
#
# Targets: Linux x86_64 (deb/rpm/AppImage), Windows x86_64 (NSIS/MSI) — built
#          here. macOS x86_64 + aarch64 (dmg) — built on a GitHub Actions
#          mirror (see .github/workflows/macos-build.yml), uploaded back into
#          this project's package registry. Releases are created here.
#
# Runner notes:
# - The Windows tag below is for gitlab.com SaaS runners. For self-hosted
#   runners, replace the `tags:` and make sure the machine has the listed
#   toolchains.
# - Tauri cannot cross-compile between OSes; each OS builds natively.

stages:
  - test
  - build
  - release

variables:
  APP_DIR: app
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  npm_config_cache: $CI_PROJECT_DIR/.npm

# ---------------------------------------------------------------- test (Linux)

test:linux:
  stage: test
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - >
      apt-get install -y curl wget file build-essential pkg-config libssl-dev
      libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      xz-utils
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - cd $APP_DIR
    - npm ci
    - npx svelte-kit sync
    - npx svelte-check --tsconfig ./tsconfig.json
    - cd src-tauri
    - cargo test --locked
  cache:
    key: linux-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm
      - $APP_DIR/src-tauri/target

# ---------------------------------------------------------------- Linux x86_64

build:linux:
  stage: build
  image: ubuntu:24.04
  needs: ["test:linux"]
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - >
      apt-get install -y curl wget file build-essential pkg-config libssl-dev
      libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      xz-utils
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - cd $APP_DIR
    - npm ci
    - npm run tauri build
  artifacts:
    name: rigpilot-linux-x86_64
    paths:
      - $APP_DIR/src-tauri/target/release/bundle/deb/*.deb
      - $APP_DIR/src-tauri/target/release/bundle/rpm/*.rpm
      - $APP_DIR/src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 2 weeks
  cache:
    key: linux-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm
      - $APP_DIR/src-tauri/target

# -------------------------------------------------------------- Windows x86_64

build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    # rustup + Node on the SaaS Windows runner (has VS Build Tools + WebView2)
    - Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain stable
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - choco install nodejs-lts --version=22.14.0 -y --no-progress
    - $env:Path = "C:\Program Files\nodejs;$env:Path"
  script:
    - cd $env:APP_DIR
    - npm ci
    - npm run tauri build
  artifacts:
    name: rigpilot-windows-x86_64
    paths:
      - $APP_DIR/src-tauri/target/release/bundle/nsis/*.exe
      - $APP_DIR/src-tauri/target/release/bundle/msi/*.msi
    expire_in: 2 weeks
  cache:
    key: windows-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm

# ----------------------------------------------------------------------- macOS
# macOS is NOT built here: GitLab SaaS macOS runners require a paid tier.
# Instead, a GitHub push mirror builds both macOS targets via GitHub Actions
# (.github/workflows/macos-build.yml) and, on tag pipelines, uploads the .dmg
# files into this project's generic package registry
# (package: rigpilot-macos/$CI_COMMIT_TAG).

# ------------------------------------------------------------ release (on tags)
# Uploads the Linux/Windows artifacts to the generic package registry, then
# creates the GitLab release with links to them. Release creation is
# idempotent: the GitHub Actions macOS job does the same for its .dmg files,
# and whichever side finishes first creates the release (the other gets HTTP
# 409 and just adds its asset links to the existing release).

release:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: ["build:linux", "build:windows"]
  variables:
    API: $CI_API_V4_URL/projects/$CI_PROJECT_ID
  script:
    - |
      set -eu
      auth="JOB-TOKEN: $CI_JOB_TOKEN"
      : > links.txt

      upload() { # upload <package-name> <file> <link-label>
        base=$(basename "$2")
        url="$API/packages/generic/$1/$CI_COMMIT_TAG/$base"
        echo "Uploading $2"
        curl --fail-with-body -H "$auth" --upload-file "$2" "$url"
        echo "$3 ($base)|$url" >> links.txt
      }

      for f in $APP_DIR/src-tauri/target/release/bundle/deb/*.deb;           do upload rigpilot-linux   "$f" "Linux .deb";      done
      for f in $APP_DIR/src-tauri/target/release/bundle/rpm/*.rpm;           do upload rigpilot-linux   "$f" "Linux .rpm";      done
      for f in $APP_DIR/src-tauri/target/release/bundle/appimage/*.AppImage; do upload rigpilot-linux   "$f" "Linux AppImage";  done
      for f in $APP_DIR/src-tauri/target/release/bundle/nsis/*.exe;          do upload rigpilot-windows "$f" "Windows installer"; done
      for f in $APP_DIR/src-tauri/target/release/bundle/msi/*.msi;           do upload rigpilot-windows "$f" "Windows .msi";    done

      links_json=""
      while IFS='|' read -r name url; do
        links_json="$links_json{\"name\":\"$name\",\"url\":\"$url\"},"
      done < links.txt

      payload="{\"tag_name\":\"$CI_COMMIT_TAG\",\"name\":\"RigPilot $CI_COMMIT_TAG\",\"description\":\"RigPilot $CI_COMMIT_TAG — Linux, Windows and macOS builds.\",\"assets\":{\"links\":[${links_json%,}]}}"
      code=$(curl -s -o resp.json -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' -d "$payload" "$API/releases")
      if [ "$code" = "201" ]; then
        echo "Release $CI_COMMIT_TAG created with Linux/Windows links."
      elif [ "$code" = "409" ]; then
        echo "Release exists (created by the GitHub macOS job) — adding links."
        while IFS='|' read -r name url; do
          curl --fail-with-body -X POST -H "$auth" \
            --data-urlencode "name=$name" --data-urlencode "url=$url" \
            "$API/releases/$CI_COMMIT_TAG/assets/links"
        done < links.txt
      else
        echo "Release creation failed with HTTP $code:" && cat resp.json && exit 1
      fi
