# RigPilot — multi-platform Tauri build pipeline
#
# Targets: Linux x86_64 (deb/rpm/AppImage), Windows x86_64 (NSIS/MSI) — built
#          here. macOS x86_64 + aarch64 (dmg) — built on a GitHub Actions
#          mirror (see .github/workflows/macos-build.yml), uploaded back into
#          this project's package registry. Releases are created here.
#
# Runner notes:
# - The Windows tag below is for gitlab.com SaaS runners. For self-hosted
#   runners, replace the `tags:` and make sure the machine has the listed
#   toolchains.
# - Tauri cannot cross-compile between OSes; each OS builds natively.

stages:
  - test
  - build
  - upload
  - release

variables:
  APP_DIR: app
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  npm_config_cache: $CI_PROJECT_DIR/.npm

# ---------------------------------------------------------------- test (Linux)

test:linux:
  stage: test
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - >
      apt-get install -y curl wget file build-essential pkg-config libssl-dev
      libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      xz-utils
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - cd $APP_DIR
    - npm ci
    - npx svelte-kit sync
    - npx svelte-check --tsconfig ./tsconfig.json
    - cd src-tauri
    - cargo test --locked
  cache:
    key: linux-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm
      - $APP_DIR/src-tauri/target

# ---------------------------------------------------------------- Linux x86_64

build:linux:
  stage: build
  image: ubuntu:24.04
  needs: ["test:linux"]
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - >
      apt-get install -y curl wget file build-essential pkg-config libssl-dev
      libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      xz-utils
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - cd $APP_DIR
    - npm ci
    - npm run tauri build
  artifacts:
    name: rigpilot-linux-x86_64
    paths:
      - $APP_DIR/src-tauri/target/release/bundle/deb/*.deb
      - $APP_DIR/src-tauri/target/release/bundle/rpm/*.rpm
      - $APP_DIR/src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 2 weeks
  cache:
    key: linux-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm
      - $APP_DIR/src-tauri/target

# -------------------------------------------------------------- Windows x86_64

build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    # rustup + Node on the SaaS Windows runner (has VS Build Tools + WebView2)
    - Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain stable
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - choco install nodejs-lts --version=22.14.0 -y --no-progress
    - $env:Path = "C:\Program Files\nodejs;$env:Path"
  script:
    - cd $env:APP_DIR
    - npm ci
    - npm run tauri build
  artifacts:
    name: rigpilot-windows-x86_64
    paths:
      - $APP_DIR/src-tauri/target/release/bundle/nsis/*.exe
      - $APP_DIR/src-tauri/target/release/bundle/msi/*.msi
    expire_in: 2 weeks
  cache:
    key: windows-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm

# ----------------------------------------------------------------------- macOS
# macOS is NOT built here: GitLab SaaS macOS runners require a paid tier.
# Instead, a GitHub push mirror builds both macOS targets via GitHub Actions
# (.github/workflows/macos-build.yml) and, on tag pipelines, uploads the .dmg
# files into this project's generic package registry
# (package: rigpilot-macos/$CI_COMMIT_TAG). Releases are still created here.

# -------------------------------------------------- upload artifacts (on tags)
# Mirror the Linux/Windows artifacts into the generic package registry so the
# release links point at permanent package URLs instead of expiring job
# artifacts.

upload:packages:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: ["build:linux", "build:windows"]
  variables:
    PKG_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic
  script:
    - |
      upload() { # upload <package-name> <file>
        echo "Uploading $2 to $1/$CI_COMMIT_TAG"
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$2" "$PKG_URL/$1/$CI_COMMIT_TAG/$(basename "$2")"
      }
    - for f in $APP_DIR/src-tauri/target/release/bundle/deb/*.deb; do upload rigpilot-linux "$f"; done
    - for f in $APP_DIR/src-tauri/target/release/bundle/rpm/*.rpm; do upload rigpilot-linux "$f"; done
    - for f in $APP_DIR/src-tauri/target/release/bundle/appimage/*.AppImage; do upload rigpilot-linux "$f"; done
    - for f in $APP_DIR/src-tauri/target/release/bundle/nsis/*.exe; do upload rigpilot-windows "$f"; done
    - for f in $APP_DIR/src-tauri/target/release/bundle/msi/*.msi; do upload rigpilot-windows "$f"; done

# ------------------------------------------------------------ release (on tags)
# Manual: trigger it once the GitHub Actions macOS build for the same tag has
# finished uploading its .dmg files to the package registry.

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
  needs: ["upload:packages"]
  variables:
    PKG_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "RigPilot $CI_COMMIT_TAG"
    description: "RigPilot $CI_COMMIT_TAG — Linux, Windows and macOS builds."
    assets:
      links:
        - name: "macOS (Apple Silicon) .dmg"
          url: "$PKG_URL/rigpilot-macos/$CI_COMMIT_TAG/RigPilot_${CI_COMMIT_TAG}_arm64.dmg"
        - name: "macOS (Intel) .dmg"
          url: "$PKG_URL/rigpilot-macos/$CI_COMMIT_TAG/RigPilot_${CI_COMMIT_TAG}_x86_64.dmg"
        - name: "Linux / Windows packages"
          url: "$CI_PROJECT_URL/-/packages"
