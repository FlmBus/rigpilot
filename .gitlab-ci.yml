# RigPilot — multi-platform Tauri build pipeline
#
# Targets: Linux x86_64 (deb/rpm/AppImage), Windows x86_64 (NSIS/MSI),
#          macOS x86_64 + aarch64 (app/dmg).
#
# Runner notes:
# - The tags below are for gitlab.com SaaS runners (macOS and Windows SaaS
#   runners require a paid tier). For self-hosted runners, replace the `tags:`
#   with your own and make sure the machines have the listed toolchains.
# - Tauri cannot cross-compile between OSes; each OS builds natively.
#   Both macOS architectures are built on the Apple-Silicon runner
#   (x86_64 via `rustup target add`).

stages:
  - test
  - build

variables:
  APP_DIR: app
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  npm_config_cache: $CI_PROJECT_DIR/.npm

# ---------------------------------------------------------------- test (Linux)

test:linux:
  stage: test
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - >
      apt-get install -y curl wget file build-essential pkg-config libssl-dev
      libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      xz-utils
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - cd $APP_DIR
    - npm ci
    - npx svelte-kit sync
    - npx svelte-check --tsconfig ./tsconfig.json
    - cd src-tauri
    - cargo test --locked
  cache:
    key: linux-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm
      - $APP_DIR/src-tauri/target

# ---------------------------------------------------------------- Linux x86_64

build:linux:
  stage: build
  image: ubuntu:24.04
  needs: ["test:linux"]
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - >
      apt-get install -y curl wget file build-essential pkg-config libssl-dev
      libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      xz-utils
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - cd $APP_DIR
    - npm ci
    - npm run tauri build
  artifacts:
    name: rigpilot-linux-x86_64
    paths:
      - $APP_DIR/src-tauri/target/release/bundle/deb/*.deb
      - $APP_DIR/src-tauri/target/release/bundle/rpm/*.rpm
      - $APP_DIR/src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 2 weeks
  cache:
    key: linux-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm
      - $APP_DIR/src-tauri/target

# -------------------------------------------------------------- Windows x86_64

build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    # rustup + Node on the SaaS Windows runner (has VS Build Tools + WebView2)
    - Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain stable
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - choco install nodejs-lts --version=22.14.0 -y --no-progress
    - $env:Path = "C:\Program Files\nodejs;$env:Path"
  script:
    - cd $env:APP_DIR
    - npm ci
    - npm run tauri build
  artifacts:
    name: rigpilot-windows-x86_64
    paths:
      - $APP_DIR/src-tauri/target/release/bundle/nsis/*.exe
      - $APP_DIR/src-tauri/target/release/bundle/msi/*.msi
    expire_in: 2 weeks
  cache:
    key: windows-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm

# ------------------------------------------------- macOS aarch64 (Apple Silicon)

.macos_base: &macos_base
  stage: build
  image: macos-15-xcode-16
  tags:
    - saas-macos-medium-m1
  before_script:
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$HOME/.cargo/bin:$PATH"
    # Node via the runner's Homebrew
    - brew install node@22 || true
    - export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
  cache:
    key: macos-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .npm

build:macos:arm64:
  <<: *macos_base
  script:
    - cd $APP_DIR
    - npm ci
    - npm run tauri build -- --target aarch64-apple-darwin
  artifacts:
    name: rigpilot-macos-arm64
    paths:
      - $APP_DIR/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - $APP_DIR/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
    expire_in: 2 weeks

# --------------------------------------------------------------- macOS x86_64
# Cross-compiled on the Apple-Silicon runner (supported within macOS).

build:macos:amd64:
  <<: *macos_base
  script:
    - rustup target add x86_64-apple-darwin
    - cd $APP_DIR
    - npm ci
    - npm run tauri build -- --target x86_64-apple-darwin
  artifacts:
    name: rigpilot-macos-x86_64
    paths:
      - $APP_DIR/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
      - $APP_DIR/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
    expire_in: 2 weeks
