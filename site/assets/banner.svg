<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="RigPilot — program your rig, not your patience">
  <defs>
    <linearGradient id="bgGlow" cx="50%" cy="0%" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0a13"/>
      <stop offset="0.55" stop-color="#0e0b0e"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="accentSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="holdFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2e88" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d11668" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="13.5" fill="none" stroke="#2a2a31"/>

  <!-- beat grid -->
  <g stroke="#2a2a31" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="360" opacity="0.55"/>
    <line x1="300" y1="0" x2="300" y2="360" opacity="0.35"/>
    <line x1="450" y1="0" x2="450" y2="360" opacity="0.55"/>
    <line x1="600" y1="0" x2="600" y2="360" opacity="0.35"/>
    <line x1="750" y1="0" x2="750" y2="360" opacity="0.55"/>
    <line x1="900" y1="0" x2="900" y2="360" opacity="0.35"/>
    <line x1="1050" y1="0" x2="1050" y2="360" opacity="0.55"/>
  </g>

  <!-- waveform, reference audio -->
  <g transform="translate(0,288)" opacity="0.6">
    <path fill="#3a3a44" d="M0 0
      q 10 -14 20 0 q 10 -26 20 0 q 10 -10 20 0 q 10 -32 20 0 q 10 -18 20 0
      q 10 -8 20 0 q 10 -24 20 0 q 10 -36 20 0 q 10 -12 20 0 q 10 -22 20 0
      q 10 -30 20 0 q 10 -9 20 0 q 10 -26 20 0 q 10 -15 20 0 q 10 -34 20 0
      q 10 -11 20 0 q 10 -20 20 0 q 10 -28 20 0 q 10 -16 20 0 q 10 -38 20 0
      q 10 -10 20 0 q 10 -24 20 0 q 10 -14 20 0 q 10 -30 20 0 q 10 -19 20 0
      q 10 -8 20 0 q 10 -27 20 0 q 10 -35 20 0 q 10 -13 20 0 q 10 -21 20 0
      q 10 -29 20 0 q 10 -10 20 0 q 10 -25 20 0 q 10 -17 20 0 q 10 -33 20 0
      q 10 -12 20 0 q 10 -22 20 0 q 10 -36 20 0 q 10 -14 20 0 q 10 -26 20 0
      q 10 -18 20 0 q 10 -9 20 0 q 10 -28 20 0 q 10 -16 20 0 q 10 -31 20 0
      q 10 -11 20 0 q 10 -23 20 0 q 10 -37 20 0 q 10 -13 20 0 q 10 -20 20 0
      q 10 -30 20 0 q 10 -10 20 0 q 10 -25 20 0 q 10 -15 20 0 q 10 -34 20 0
      q 10 -12 20 0 q 10 -22 20 0 q 10 -27 20 0 q 10 -17 20 0 q 10 -29 20 0
      L 1200 0 Z"/>
    <path fill="#2a2a31" d="M0 0
      q 10 14 20 0 q 10 26 20 0 q 10 10 20 0 q 10 32 20 0 q 10 18 20 0
      q 10 8 20 0 q 10 24 20 0 q 10 36 20 0 q 10 12 20 0 q 10 22 20 0
      q 10 30 20 0 q 10 9 20 0 q 10 26 20 0 q 10 15 20 0 q 10 34 20 0
      q 10 11 20 0 q 10 20 20 0 q 10 28 20 0 q 10 16 20 0 q 10 38 20 0
      q 10 10 20 0 q 10 24 20 0 q 10 14 20 0 q 10 30 20 0 q 10 19 20 0
      q 10 8 20 0 q 10 27 20 0 q 10 35 20 0 q 10 13 20 0 q 10 21 20 0
      q 10 29 20 0 q 10 10 20 0 q 10 25 20 0 q 10 17 20 0 q 10 33 20 0
      q 10 12 20 0 q 10 22 20 0 q 10 36 20 0 q 10 14 20 0 q 10 26 20 0
      q 10 18 20 0 q 10 9 20 0 q 10 28 20 0 q 10 16 20 0 q 10 31 20 0
      q 10 11 20 0 q 10 23 20 0 q 10 37 20 0 q 10 13 20 0 q 10 20 20 0
      q 10 30 20 0 q 10 10 20 0 q 10 25 20 0 q 10 15 20 0 q 10 34 20 0
      q 10 12 20 0 q 10 22 20 0 q 10 27 20 0 q 10 17 20 0 q 10 29 20 0
      L 1200 0 Z"/>
  </g>

  <!-- event motifs floating on the grid -->
  <g filter="url(#softGlow)">
    <!-- hold blocks -->
    <rect x="640" y="70" width="170" height="26" rx="6" fill="url(#holdFill)"/>
    <rect x="850" y="118" width="110" height="26" rx="6" fill="url(#holdFill)" opacity="0.8"/>
    <!-- one-shot diamonds -->
    <rect x="760" y="160" width="15" height="15" fill="#ffb02e" transform="rotate(45 767.5 167.5)"/>
    <rect x="1010" y="78" width="15" height="15" fill="#ffb02e" transform="rotate(45 1017.5 85.5)"/>
    <rect x="918" y="186" width="15" height="15" fill="#ffb02e" transform="rotate(45 925.5 193.5)"/>
    <!-- automation curve -->
    <path d="M 640 215 C 700 215 710 178 770 178 S 860 205 920 205 S 1040 168 1100 168"
          fill="none" stroke="#2ee08a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="640" cy="215" r="5" fill="#0b0b0d" stroke="#2ee08a" stroke-width="2.5"/>
    <circle cx="770" cy="178" r="5" fill="#0b0b0d" stroke="#2ee08a" stroke-width="2.5"/>
    <circle cx="920" cy="205" r="5" fill="#0b0b0d" stroke="#2ee08a" stroke-width="2.5"/>
    <circle cx="1100" cy="168" r="5" fill="#0b0b0d" stroke="#2ee08a" stroke-width="2.5"/>
  </g>

  <!-- playhead -->
  <g>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#ff2e88" stroke-width="2" opacity="0.9"/>
    <path d="M 592 0 L 608 0 L 600 12 Z" fill="#ff2e88"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Outfit','Archivo',ui-sans-serif,system-ui,'Segoe UI',sans-serif">
    <text x="84" y="158" font-size="84" font-weight="800" letter-spacing="-2" fill="#f2f2f5">Rig<tspan fill="#ff2e88">Pilot</tspan></text>
    <text x="88" y="206" font-size="23" font-weight="500" letter-spacing="0.5" fill="#9a9aa6">Program your rig. Not your patience.</text>
    <text x="88" y="246" font-size="15" font-weight="400" letter-spacing="0.4" fill="#5d5d68">MIDI rig-control sequencing for live shows — definitions in, standard .mid out.</text>
  </g>

  <!-- accent underline -->
  <rect x="84" y="172" width="330" height="3" rx="1.5" fill="url(#accentSweep)"/>
</svg>
