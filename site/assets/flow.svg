<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Workflow: device definitions go into RigPilot, standard MIDI files come out, the show DAW plays them to the rigs on stage">
  <defs>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1f"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2e88"/>
    </marker>
  </defs>

  <rect width="1200" height="230" rx="14" fill="#0b0b0d"/>
  <rect x="0.5" y="0.5" width="1199" height="229" rx="13.5" fill="none" stroke="#2a2a31"/>

  <!-- card: definitions -->
  <g>
    <rect x="40" y="50" width="230" height="130" rx="12" fill="url(#cardEdge)" stroke="#2a2a31"/>
    <text x="155" y="84" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13" fill="#ffb02e">&lt;DeviceDefinition&gt;</text>
    <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#9a9aa6">
      <text x="68" y="106">&lt;Command name=</text>
      <text x="172" y="106" fill="#2ee08a">"Stomp A"</text>
      <text x="68" y="124">  type=</text>
      <text x="112" y="124" fill="#ff2e88">"Hold"</text>
      <text x="155" y="124">/&gt;</text>
    </g>
    <text x="155" y="160" text-anchor="middle" font-family="'Outfit',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f2f2f5">Device Definitions</text>
    <text x="155" y="176" text-anchor="middle" font-family="'Outfit',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5d5d68">XML, QLC+-style fixture library</text>
  </g>

  <line x1="280" y1="115" x2="335" y2="115" stroke="#ff2e88" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- card: rigpilot -->
  <g>
    <rect x="345" y="40" width="280" height="150" rx="12" fill="url(#cardEdge)" stroke="#ff2e88"/>
    <text x="485" y="80" text-anchor="middle" font-family="'Outfit',ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="800" fill="#f2f2f5">Rig<tspan fill="#ff2e88">Pilot</tspan></text>
    <!-- mini timeline -->
    <g>
      <line x1="380" y1="105" x2="590" y2="105" stroke="#2a2a31"/>
      <line x1="380" y1="130" x2="590" y2="130" stroke="#2a2a31"/>
      <rect x="392" y="96" width="11" height="11" fill="#ffb02e" transform="rotate(45 397.5 101.5)"/>
      <rect x="425" y="98" width="60" height="14" rx="4" fill="#ff2e88" opacity="0.9"/>
      <rect x="540" y="96" width="11" height="11" fill="#ffb02e" transform="rotate(45 545.5 101.5)"/>
      <path d="M 392 128 C 430 128 440 116 480 116 S 550 126 590 122" fill="none" stroke="#2ee08a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="485" y="160" text-anchor="middle" font-family="'Outfit',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f2f2f5">Place events by ear</text>
    <text x="485" y="176" text-anchor="middle" font-family="'Outfit',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5d5d68">against the reference audio, on a BPM grid</text>
  </g>

  <line x1="635" y1="115" x2="690" y2="115" stroke="#ff2e88" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- card: midi files -->
  <g>
    <rect x="700" y="50" width="200" height="130" rx="12" fill="url(#cardEdge)" stroke="#2a2a31"/>
    <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="13">
      <text x="800" y="92" text-anchor="middle" fill="#f2f2f5">lead-rig.mid</text>
      <text x="800" y="112" text-anchor="middle" fill="#f2f2f5">rhythm-rig.mid</text>
      <text x="800" y="132" text-anchor="middle" fill="#f2f2f5">bass-rig.mid</text>
    </g>
    <text x="800" y="160" text-anchor="middle" font-family="'Outfit',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f2f2f5">Standard MIDI files</text>
    <text x="800" y="176" text-anchor="middle" font-family="'Outfit',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5d5d68">latency-compensated, one per track</text>
  </g>

  <line x1="910" y1="115" x2="965" y2="115" stroke="#ff2e88" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- card: DAW / stage -->
  <g>
    <rect x="975" y="50" width="185" height="130" rx="12" fill="url(#cardEdge)" stroke="#2a2a31"/>
    <!-- faders -->
    <g stroke="#2a2a31" stroke-width="3" stroke-linecap="round">
      <line x1="1015" y1="80" x2="1015" y2="120"/>
      <line x1="1045" y1="80" x2="1045" y2="120"/>
      <line x1="1075" y1="80" x2="1075" y2="120"/>
      <line x1="1105" y1="80" x2="1105" y2="120"/>
    </g>
    <g fill="#ff2e88">
      <rect x="1008" y="88" width="14" height="7" rx="2"/>
      <rect x="1038" y="100" width="14" height="7" rx="2"/>
      <rect x="1068" y="84" width="14" height="7" rx="2"/>
      <rect x="1098" y="106" width="14" height="7" rx="2"/>
    </g>
    <text x="1067" y="160" text-anchor="middle" font-family="'Outfit',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f2f2f5">Your show DAW</text>
    <text x="1067" y="176" text-anchor="middle" font-family="'Outfit',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5d5d68">Studio One, Reaper, anything</text>
  </g>
</svg>
